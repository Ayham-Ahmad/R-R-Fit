        return [...trainees]
          .sort((a, b) => {
            if (b.weeklyScore !== a.weeklyScore) return b.weeklyScore - a.weeklyScore;
            return b.completedCount - a.completedCount;
          })
          .map((item, index) => ({
            ...item,
            rank: index + 1,
            isCurrentUser: item.id === currentTrainee.id
          }));
      }, [trainees, currentTrainee.id]);

      const firstPlaceWinner = rankedLeaderboard[0];

      // Handlers
      const handleExerciseAction = (dateIso, assignmentId, nextStatus) => {
        setSchedule((prev) =>
          prev.map((day) => {
            if (day.dateIso !== dateIso) return day;
            const nextEx = day.exercises.map((e) =>
              e.assignmentId === assignmentId ? { ...e, status: nextStatus } : e
            );
            const completedTotal = nextEx.filter((e) => e.status === 'COMPLETED').length;
            const allDone = nextEx.length > 0 && completedTotal === nextEx.length;
            return {
              ...day,
              exercises: nextEx,
              status: allDone ? 'COMPLETED' : 'IN_PROGRESS'
            };
          })
        );
        notify(lang === 'ar' ? 'تم تحديث حالة التمرين وحفظ تقدمك!' : 'Exercise updated and progress saved!');
      };

      const toggleTraineeSubscription = (id, mode) => {
        setTrainees((prev) =>
          prev.map((tr) => {
            if (tr.id !== id) return tr;
            if (mode === 'sub') {
              const nextSub = tr.subscriptionStatus === 'ACTIVE' ? 'EXPIRED' : 'ACTIVE';
              return { ...tr, subscriptionStatus: nextSub, isLocked: nextSub === 'EXPIRED' };
            }
            return { ...tr, isLocked: !tr.isLocked };

                      }`}
                    >
                      {tab.label}
                    </button>
                  ))}
                </div>
              </div>

              <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8 space-y-8">
                {coachTab === 'dashboard' && (
                  <>
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 metric-num">
                      <div className="bg-white p-5 rounded-xl border border-[#E4E4E0]">
                        <span className="text-xs text-[#525866] font-semibold">{t.coach.totalTrainees}</span>
                        <p className="text-2xl font-extrabold mt-1">{trainees.length}</p>
                      </div>
                      <div className="bg-white p-5 rounded-xl border border-[#E4E4E0]">
                        <span className="text-xs text-[#525866] font-semibold">{t.coach.activeSubs}</span>
                        <p className="text-2xl font-extrabold text-[#157347] mt-1">
                          {trainees.filter((x) => x.subscriptionStatus === 'ACTIVE').length}
                        </p>
                      </div>
                      <div className="bg-white p-5 rounded-xl border border-[#E4E4E0]">
                        <span className="text-xs text-[#525866] font-semibold">{t.coach.expiredSubs}</span>
                        <p className="text-2xl font-extrabold text-[#B91C1C] mt-1">
                          {trainees.filter((x) => x.subscriptionStatus === 'EXPIRED' || x.isLocked).length}
                        </p>
                      </div>
                      <div className="bg-white p-5 rounded-xl border border-[#E4E4E0]">
                        <span className="text-xs text-[#525866] font-semibold">{t.coach.avgCompletion}</span>
                        <p className="text-2xl font-extrabold text-[#7A1C3E] mt-1">77%</p>
                      </div>
                    </div>

                    <div className="bg-white rounded-xl border border-[#E4E4E0] p-6 space-y-4">
                      <h2 className="text-base font-extrabold">{t.coach.rosterTitle}</h2>
                      <div className="divide-y divide-[#E4E4E0]">
                        {trainees.map((tr) => (
                          <div key={tr.id} className="py-3 flex flex-wrap items-center justify-between gap-3">
                            <div className="flex items-center gap-3">
                              <img src={tr.avatar} className="w-10 h-10 rounded-full object-cover" />
                              <div>
                                <p className="text-sm font-bold">{lang === 'ar' ? tr.nameAr : tr.name}</p>
                                <p className="text-xs text-[#525866]">{lang === 'ar' ? tr.goalAr : tr.goalEn}</p>
                              </div>
                            </div>
                            <div className="flex items-center gap-2">
                              <span
                                className={`px-2.5 py-0.5 rounded text-xs font-bold ${
                                  tr.subscriptionStatus === 'ACTIVE' && !tr.isLocked
                                    ? 'bg-[#EAF6F0] text-[#157347]'
                                    : 'bg-[#FDF2F2] text-[#B91C1C]'
                                }`}
                              >
                                {tr.subscriptionStatus === 'ACTIVE' && !tr.isLocked ? t.active : t.expired}
                              </span>
                              <button
                                onClick={() => {
                                  setCoachSelectedTraineeId(tr.id);
                                  setCoachTab('trainees');
                                }}
                                className="px-3 py-1.5 rounded-lg bg-[#121316] hover:bg-[#7A1C3E] text-white text-xs font-bold transition"
                              >
                                {t.coach.manageBtn}
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </>
                )}

                {coachTab === 'trainees' && (
                  <div className="space-y-6">
                    {/* Trainee Selector & Subscription / WhatsApp Controls */}
                    <div className="bg-white rounded-xl border border-[#E4E4E0] p-6 space-y-5">
                      <div className="flex flex-wrap items-center justify-between gap-4 border-b border-[#E4E4E0] pb-5">
                        <div className="flex items-center gap-3.5">
                          <img src={coachTrainee.avatar} className="w-14 h-14 rounded-full object-cover ring-2 ring-[#7A1C3E]" />
                          <div>
                            <select
                              value={coachSelectedTraineeId}
                              onChange={(e) => setCoachSelectedTraineeId(e.target.value)}
                              className="text-lg font-extrabold text-[#121316] bg-transparent border-b border-dashed border-[#121316] focus:outline-none"
                            >
                              {trainees.map((tr) => (
                                <option key={tr.id} value={tr.id}>
                                  {lang === 'ar' ? tr.nameAr : tr.name}
                                </option>
                              ))}
                            </select>
                            <p className="text-xs text-[#525866] mt-1">
                              {lang === 'ar' ? coachTrainee.goalAr : coachTrainee.goalEn}
                            </p>
                          </div>
                        </div>

                        <div className="flex flex-wrap items-center gap-2">
                          <button
                            onClick={() => toggleTraineeSubscription(coachTrainee.id, 'sub')}
                            className={`px-3 py-2 rounded-lg text-xs font-bold border ${
                              coachTrainee.subscriptionStatus === 'ACTIVE'
                                ? 'bg-[#FDF2F2] text-[#B91C1C] border-[#F5C2C2]'
                                : 'bg-[#EAF6F0] text-[#157347] border-[#B8E2CD]'
                            }`}
                          >
                            {coachTrainee.subscriptionStatus === 'ACTIVE'
                              ? t.subscription.expireBtn
                              : t.subscription.activateBtn}
                          </button>

                          <button
                            onClick={() => toggleTraineeSubscription(coachTrainee.id, 'lock')}
                            className="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg border border-[#E4E4E0] text-xs font-bold"
                          >
                            {coachTrainee.isLocked ? <IconUnlock className="w-3.5 h-3.5"/> : <IconLock className="w-3.5 h-3.5"/>}
                            <span>{coachTrainee.isLocked ? t.subscription.unlockBtn : t.subscription.lockBtn}</span>
                          </button>

                          <a
                            href={`https://wa.me/${coachTrainee.phone.replace(/[^\d]/g, '')}`}
                            target="_blank"
                            rel="noreferrer"
                            className="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-[#157347] text-white text-xs font-bold"
                          >
                            <IconWhatsApp className="w-3.5 h-3.5"/>
                            <span>{t.whatsappTrainee}</span>
                          </a>
                        </div>
                      </div>

                      {/* SPLIT WORKOUT PLAN BUILDER */}
                      <h3 className="text-base font-extrabold">{t.coach.builderTitle}</h3>
                      <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                        {/* Exercise Library Column */}
                        <div className="lg:col-span-5 bg-[#F8F7F4] p-4 rounded-xl border border-[#E4E4E0] space-y-3">
                          <h4 className="text-xs font-extrabold uppercase text-[#525866]">{t.coach.libraryHeader}</h4>
                          <div className="space-y-2">
                            {exercises.map((ex) => (
                              <div key={ex.id} className="bg-white p-2.5 rounded-lg border border-[#E4E4E0] flex items-center justify-between gap-2">
                                <div className="flex items-center gap-2.5">
                                  <img src={ex.imageUrl} className="w-10 h-10 rounded object-cover" />
                                  <div>
                                    <p className="text-xs font-bold">{lang === 'ar' ? ex.nameAr : ex.nameEn}</p>
                                    <span className="text-[10px] text-[#7A1C3E] font-bold">
                                      {lang === 'ar' ? ex.categoryAr : ex.categoryEn}
                                    </span>
                                  </div>
                                </div>
                                <button
                                  onClick={() => addExerciseToDay(ex)}
                                  className="px-2.5 py-1 rounded bg-[#121316] hover:bg-[#7A1C3E] text-white text-xs font-bold"
                                >
                                  + {t.add}
                                </button>
                              </div>
                            ))}
                          </div>
                        </div>

                        {/* Weekly Schedule Column */}
                        <div className="lg:col-span-7 bg-white p-4 rounded-xl border border-[#E4E4E0] space-y-4">
                          <div className="flex items-center justify-between">
                            <h4 className="text-xs font-extrabold uppercase text-[#525866]">{t.coach.scheduleHeader}</h4>
                            <button
                              onClick={() => setDayRest(activeDaySession.dateIso)}
                              className="px-2.5 py-1 rounded bg-[#F2EFE9] text-xs font-bold"
                            >
                              {t.coach.markRestDay}
                            </button>
                          </div>

                          <div className="grid grid-cols-7 gap-1">
                            {schedule.map((d) => (
                              <button
                                key={d.dateIso}
                                onClick={() => setSelectedDayIso(d.dateIso)}
                                className={`py-2 rounded text-xs font-bold border ${
                                  d.dateIso === selectedDayIso
                                    ? 'bg-[#7A1C3E] text-white border-[#7A1C3E]'
                                    : 'bg-[#F8F7F4] text-[#121316] border-[#E4E4E0]'
                                }`}
                              >
                                {lang === 'ar' ? d.dayAr : d.dayEn}
                              </button>
                            ))}
                          </div>

                          <div className="space-y-2">
                            {activeDaySession.status === 'REST_DAY' ? (
                              <div className="p-6 text-center text-xs text-[#525866] bg-[#F8F7F4] rounded-lg">
                                {t.restDay}
                              </div>
                            ) : (
                              activeDaySession.exercises.map((ex) => (
                                <div key={ex.assignmentId} className="p-3 rounded-lg border border-[#E4E4E0] flex items-center justify-between">
                                  <div>
                                    <p className="text-xs font-bold">{lang === 'ar' ? ex.nameAr : ex.nameEn}</p>
                                    <p className="text-[11px] text-[#525866] metric-num">
                                      {ex.sets} {t.trainee.sets} × {ex.reps} • {ex.restSec}s
                                    </p>
                                  </div>
                                  <button
                                    onClick={() =>
                                      setSchedule((prev) =>
                                        prev.map((d) =>
                                          d.dateIso === activeDaySession.dateIso
                                            ? { ...d, exercises: d.exercises.filter((i) => i.assignmentId !== ex.assignmentId) }
                                            : d
                                        )
                                      )
                                    }
                                    className="text-xs font-bold text-[#B91C1C]"
                                  >
                                    {t.delete}
                                  </button>
                                </div>
                              ))
                            )}
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {coachTab === 'exercises' && (
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                    {exercises.map((ex) => (
                      <div key={ex.id} className="bg-white rounded-xl border border-[#E4E4E0] overflow-hidden">
                        <img src={ex.imageUrl} className="w-full h-40 object-cover" />
                        <div className="p-4 space-y-1">
                          <span className="text-[10px] font-bold uppercase text-[#7A1C3E]">
                            {lang === 'ar' ? ex.categoryAr : ex.categoryEn}
                          </span>
                          <h3 className="text-sm font-extrabold">{lang === 'ar' ? ex.nameAr : ex.nameEn}</h3>
                          <p className="text-xs text-[#525866] line-clamp-2">{lang === 'ar' ? ex.descAr : ex.descEn}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {coachTab === 'leaderboard' && (
                  <div className="bg-white rounded-xl border border-[#E4E4E0] p-6 space-y-6">
                    <div className="flex flex-wrap items-center justify-between gap-4 border-b border-[#E4E4E0] pb-4">
                      <div>
                        <h2 className="text-lg font-extrabold">{t.leaderboard.coachTitle}</h2>
                        <p className="text-xs text-[#525866]">
                          {leaderboardPublished ? t.leaderboard.publishedState : t.leaderboard.hiddenState}
                        </p>
                      </div>
                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => setLeaderboardPublished(!leaderboardPublished)}
                          className="px-4 py-2 rounded-lg bg-[#121316] text-white text-xs font-bold"
                        >
                          {t.leaderboard.togglePublish}
                        </button>
                        <button
                          onClick={() => setShowResetModal(true)}
                          className="px-4 py-2 rounded-lg bg-[#FDF2F2] text-[#B91C1C] border border-[#F5C2C2] text-xs font-bold"
                        >
                          {t.leaderboard.resetBtn}
                        </button>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div>
                        <label className="text-xs font-bold text-[#525866] block mb-1.5">
                          {t.leaderboard.rewardInputLabel}
                        </label>
                        <input
                          type="text"
                          value={lang === 'ar' ? rewardAr : rewardEn}
                          onChange={(e) => (lang === 'ar' ? setRewardAr(e.target.value) : setRewardEn(e.target.value))}
                          className="w-full px-3.5 py-2 rounded-lg border border-[#E4E4E0] text-sm font-bold"
                        />
                      </div>
                      <div className="p-4 rounded-xl bg-[#FBF7EB] border border-[#E6CE8A] flex items-center justify-between">
                        <div className="flex items-center gap-3">
                          <img src={firstPlaceWinner.avatar} className="w-11 h-11 rounded-full object-cover ring-2 ring-[#C59B27]" />
                          <div>
                            <span className="text-[10px] font-bold uppercase text-[#8F6D0F]">{t.leaderboard.firstPlaceBadge}</span>
                            <p className="text-sm font-extrabold">
                              {lang === 'ar' ? firstPlaceWinner.nameAr : firstPlaceWinner.name} ({firstPlaceWinner.weeklyScore}%)
                            </p>
                          </div>
                        </div>
                        <button
                          onClick={() => notify(lang === 'ar' ? 'تم اعتماد الفائزة ومنح الحصة المجانية!' : 'Winner confirmed for One Extra Free Class!')}
                          className="px-3 py-2 rounded-lg bg-[#121316] text-white text-xs font-bold"
                        >
                          {t.leaderboard.confirmWinnerBtn}
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {showResetModal && (
                  <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
                    <div className="bg-white rounded-xl max-w-md w-full p-6 space-y-4">
                      <h3 className="text-base font-extrabold">{t.leaderboard.resetModalTitle}</h3>
                      <p className="text-xs text-[#525866] leading-relaxed">{t.leaderboard.resetModalBody}</p>
                      <div className="flex justify-end gap-2 pt-2">
                        <button onClick={() => setShowResetModal(false)} className="px-4 py-2 rounded-lg border text-xs font-bold">
                          {t.cancel}
                        </button>
                        <button
                          onClick={() => {
                            setLeaderboardPublished(false);
                            setShowResetModal(false);
                            notify(lang === 'ar' ? 'تمت إعادة تعيين لوحة الأسبوع بنجاح' : 'Leaderboard week reset');
                          }}
                          className="px-4 py-2 rounded-lg bg-[#B91C1C] text-white text-xs font-bold"
                        >
                          {t.confirm}
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </main>
            </div>
          )}

          {/* ================================================================
              ROLE 3: TECHNICAL ADMINISTRATOR INTERFACE
             ================================================================ */}
          {role === 'ADMIN' && (
            <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-8 space-y-6">
              <h1 className="text-2xl font-extrabold">{t.nav.adminOverview}</h1>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 metric-num">
                <div className="bg-white p-5 rounded-xl border border-[#E4E4E0]">
                  <span className="text-xs text-[#525866] font-bold">{t.nav.adminCoaches}</span>
                  <p className="text-3xl font-extrabold mt-1">14</p>
                </div>
                <div className="bg-white p-5 rounded-xl border border-[#E4E4E0]">
                  <span className="text-xs text-[#525866] font-bold">{t.coach.totalTrainees}</span>
                  <p className="text-3xl font-extrabold mt-1">382</p>
                </div>
                <div className="bg-white p-5 rounded-xl border border-[#E4E4E0]">
                  <span className="text-xs text-[#525866] font-bold">{t.nav.adminCategories}</span>
                  <p className="text-3xl font-extrabold text-[#7A1C3E] mt-1">{CATEGORIES.length}</p>
                </div>
              </div>
            </main>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
