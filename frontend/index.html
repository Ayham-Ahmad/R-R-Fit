<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="v1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090A0C" />
  <meta name="description" content="Private, coach-led fitness programs with verified progress. برامج لياقة خاصة بإشراف المدربة مع تقدم موثّق." />
  <title>Fitness Coaching Studio</title>
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Cairo:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles/main.css" />
  <link rel="stylesheet" href="/styles/app.css" />
  <link rel="stylesheet" href="/styles/redesign.css" />
</head>
<body>
  <div id="app">
    <div class="app-loading" role="status" aria-live="polite">
      <div class="loading-mark loading-mark-image"><img src="/assets/logo.png" alt="" /></div>
      <span class="spinner" aria-hidden="true"></span>
    </div>
  </div>
  <div class="modal-backdrop" id="appModalBackdrop" aria-hidden="true">
    <div class="modal-box" id="appModalContent" role="dialog" aria-modal="true" aria-label="Dialog / نافذة"></div>
  </div>
  <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="false"></div>
  <noscript>R&amp;R Fit requires JavaScript to run. يحتاج R&amp;R Fit إلى JavaScript للعمل.</noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
