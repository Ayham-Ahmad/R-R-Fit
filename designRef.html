<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="v1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rana Royal fitness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@600;700&family=Cairo:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       1. DESIGN SYSTEM TOKENS — 3 DISTINCT VISUAL CONCEPTS
       ========================================================================== */
    :root,
    [data-theme="v1"] {
      /* Version 1: Elegant & Soft */
      --bg-main: #FCF9F7;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F6EFEA;
      --bg-accent-soft: #F9E6E8;
      --text-primary: #2D2628;
      --text-secondary: #6E5F63;
      --text-muted: #9A898E;
      --primary: #C87D87;
      --primary-hover: #B36872;
      --primary-contrast: #FFFFFF;
      --secondary: #8FA895;
      --secondary-soft: #E9F0EB;
      --border-color: #ECDFDC;
      --radius-sm: 12px;
      --radius-md: 18px;
      --radius-lg: 26px;
      --radius-pill: 999px;
      --shadow-card: 0 10px 30px -8px rgba(145, 95, 102, 0.09);
      --shadow-hover: 0 16px 36px -6px rgba(145, 95, 102, 0.15);
      --font-heading-en: 'Playfair Display', Georgia, serif;
      --font-body-en: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-heading-ar: 'Amiri', serif;
      --font-body-ar: 'Tajawal', sans-serif;
      --banner-gradient: linear-gradient(135deg, #F9E6E8 0%, #F4EDE6 100%);
      --card-border-width: 1px;
      /* V1 Winner Styling: Champagne Gold & Soft Blush */
      --winner-card-bg: linear-gradient(135deg, #FFFDF9 0%, #FBF0EE 55%, #F9EFE2 100%);
      --winner-border: #DFC28F;
      --winner-ring: linear-gradient(135deg, #E5C158 0%, #C87D87 50%, #F3E5AB 100%);
      --winner-glow: 0 12px 34px -4px rgba(212, 175, 55, 0.28);
      --winner-badge-bg: linear-gradient(135deg, #D4AF37 0%, #C59B27 100%);
      --reward-banner-bg: linear-gradient(135deg, #FFF8E7 0%, #F9E6E8 100%);
    }

    [data-theme="v2"] {
      /* Version 2: Modern & Minimal */
      --bg-main: #F7F7FA;
      --bg-surface: #FFFFFF;
      --bg-subtle: #EFEFF6;
      --bg-accent-soft: #ECE8F8;
      --text-primary: #1F1F29;
      --text-secondary: #57566B;
      --text-muted: #87869B;
      --primary: #5D3FD3;
      --primary-hover: #4A2FB8;
      --primary-contrast: #FFFFFF;
      --secondary: #987D9A;
      --secondary-soft: #F2ECF3;
      --border-color: #E2E1EC;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-pill: 8px;
      --shadow-card: 0 2px 6px rgba(25, 22, 48, 0.04);
      --shadow-hover: 0 8px 20px rgba(25, 22, 48, 0.08);
      --font-heading-en: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-body-en: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-heading-ar: 'Cairo', sans-serif;
      --font-body-ar: 'Cairo', sans-serif;
      --banner-gradient: linear-gradient(135deg, #ECE8F8 0%, #F4F4F9 100%);
      --card-border-width: 1px;
      /* V2 Winner Styling: Clean Restrained Gold & Royal Lavender */
      --winner-card-bg: linear-gradient(135deg, #FFFFFF 0%, #F6F4FD 65%, #FCF8EE 100%);
      --winner-border: #D5B869;
      --winner-ring: linear-gradient(135deg, #D4AF37 0%, #5D3FD3 100%);
      --winner-glow: 0 8px 24px rgba(93, 63, 211, 0.14);
      --winner-badge-bg: linear-gradient(135deg, #C9A227 0%, #5D3FD3 100%);
      --reward-banner-bg: #F6F4FD;
    }

    [data-theme="v3"] {
      /* Version 3: Warm & Fresh */
      --bg-main: #FFFBF7;
      --bg-surface: #FFFFFF;
      --bg-subtle: #FDF1E6;
      --bg-accent-soft: #FCE5D8;
      --text-primary: #2F2621;
      --text-secondary: #6E5B50;
      --text-muted: #9E897C;
      --primary: #D96B52;
      --primary-hover: #C2563E;
      --primary-contrast: #FFFFFF;
      --secondary: #7CA388;
      --secondary-soft: #E6F0E9;
      --border-color: #F2DFD1;
      --radius-sm: 14px;
      --radius-md: 20px;
      --radius-lg: 28px;
      --radius-pill: 999px;
      --shadow-card: 0 8px 24px -4px rgba(185, 102, 72, 0.09);
      --shadow-hover: 0 14px 32px -4px rgba(185, 102, 72, 0.16);
      --font-heading-en: 'Outfit', sans-serif;
      --font-body-en: 'Outfit', sans-serif;
      --font-heading-ar: 'Tajawal', sans-serif;
      --font-body-ar: 'Tajawal', sans-serif;
      --banner-gradient: linear-gradient(135deg, #FCE5D8 0%, #FBF2E3 100%);
      --card-border-width: 2px;
      /* V3 Winner Styling: Warm Coral, Peach & Sunlit Gold */
      --winner-card-bg: linear-gradient(135deg, #FFFDF9 0%, #FDECE2 55%, #FBF2D9 100%);
      --winner-border: #E2B062;
      --winner-ring: linear-gradient(135deg, #F0B429 0%, #D96B52 60%, #F7D774 100%);
      --winner-glow: 0 12px 32px -4px rgba(217, 107, 82, 0.22);
      --winner-badge-bg: linear-gradient(135deg, #E09F24 0%, #D96B52 100%);
      --reward-banner-bg: linear-gradient(135deg, #FFF6E0 0%, #FCE5D8 100%);
    }

    :root {
      --status-success-bg: #E6F4EA;
      --status-success-text: #1E7E34;
      --status-danger-bg: #FCE8E6;
      --status-danger-text: #C5221F;
      --status-warning-bg: #FEF7E0;
      --status-warning-text: #B06000;
      --whatsapp-green: #25D366;
      --whatsapp-green-dark: #1DA851;
      --silver-accent: #9AA4B2;
      --silver-bg: #F1F4F8;
      --bronze-accent: #B87333;
      --bronze-bg: #F9EFE6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html[lang="en"] body { font-family: var(--font-body-en); direction: ltr; text-align: left; }
    html[lang="en"] h1, html[lang="en"] h2, html[lang="en"] h3, html[lang="en"] h4, html[lang="en"] .brand-title { font-family: var(--font-heading-en); }

    html[lang="ar"] body { font-family: var(--font-body-ar); direction: rtl; text-align: right; }
    html[lang="ar"] h1, html[lang="ar"] h2, html[lang="ar"] h3, html[lang="ar"] h4, html[lang="ar"] .brand-title { font-family: var(--font-heading-ar); }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

    /* Top Presentation Switcher Bar */
    .demo-toolbar {
      background: #1C191F;
      color: #F5F2F6;
      padding: 10px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      font-size: 0.85rem;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .demo-toolbar-group { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    .demo-label { color: #B8B0C2; font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .demo-pill-group { display: inline-flex; background: rgba(255,255,255,0.08); padding: 3px; border-radius: 8px; gap: 4px; }
    .demo-pill { background: transparent; border: none; color: #D9D3E0; padding: 5px 11px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 0.82rem; transition: all 0.18s ease; }
    .demo-pill:hover { color: #FFFFFF; background: rgba(255,255,255,0.12); }
    .demo-pill.active { background: var(--primary); color: var(--primary-contrast); font-weight: 600; }
    .demo-select { background: rgba(255,255,255,0.12); color: #FFFFFF; border: 1px solid rgba(255,255,255,0.2); padding: 5px 10px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; }
    .demo-select option { background: #1C191F; color: #FFFFFF; }
    .lang-toggle-btn { background: rgba(255,255,255,0.14); color: #FFFFFF; border: 1px solid rgba(255,255,255,0.28); padding: 5px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }

    /* Application Layout */
    .app-shell { display: grid; grid-template-columns: 265px 1fr; min-height: calc(100vh - 52px); }
    .sidebar { background: var(--bg-surface); border-inline-end: var(--card-border-width) solid var(--border-color); padding: 28px 20px; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; }
    .brand-box { display: flex; align-items: center; gap: 12px; padding-bottom: 22px; border-bottom: 1px solid var(--border-color); }
    .brand-logo { width: 42px; height: 42px; border-radius: var(--radius-md); background: var(--primary); color: var(--primary-contrast); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.2rem; flex-shrink: 0; }
    .brand-title { font-size: 1.25rem; font-weight: 700; color: var(--text-primary); line-height: 1.2; }
    .brand-subtitle { font-size: 0.78rem; color: var(--text-muted); }
    .nav-list { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
    .nav-btn { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-md); border: none; background: transparent; color: var(--text-secondary); font-weight: 500; font-size: 0.95rem; cursor: pointer; transition: all 0.2s ease; text-align: start; }
    .nav-btn:hover { background: var(--bg-subtle); color: var(--text-primary); }
    .nav-btn.active { background: var(--primary); color: var(--primary-contrast); font-weight: 600; box-shadow: var(--shadow-card); }
    .nav-icon { font-size: 1.1rem; width: 22px; text-align: center; flex-shrink: 0; }
    .sidebar-footer { background: var(--bg-subtle); padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border-color); }
    .role-badge { display: inline-block; padding: 4px 10px; border-radius: var(--radius-pill); background: var(--bg-accent-soft); color: var(--primary); font-weight: 700; font-size: 0.75rem; margin-bottom: 8px; }
    .main-area { display: flex; flex-direction: column; min-width: 0; }
    .top-header { background: var(--bg-surface); border-bottom: var(--card-border-width) solid var(--border-color); padding: 18px 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .header-title-area h1 { font-size: 1.45rem; font-weight: 700; color: var(--text-primary); }
    .header-title-area p { font-size: 0.88rem; color: var(--text-secondary); }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .user-chip { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: var(--bg-subtle); border-radius: var(--radius-pill); border: 1px solid var(--border-color); }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--bg-accent-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; flex-shrink: 0; overflow: hidden; border: 1.5px solid var(--border-color); }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .workspace { padding: 32px; max-width: 1440px; width: 100%; margin: 0 auto; }

    /* Cards & Grids */
    .card { background: var(--bg-surface); border: var(--card-border-width) solid var(--border-color); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-card); }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 20px; margin-bottom: 28px; }
    .kpi-card { background: var(--bg-surface); border: var(--card-border-width) solid var(--border-color); border-radius: var(--radius-lg); padding: 22px; box-shadow: var(--shadow-card); display: flex; flex-direction: column; gap: 8px; }
    .kpi-top { display: flex; align-items: center; justify-content: space-between; color: var(--text-secondary); font-size: 0.88rem; font-weight: 500; }
    .kpi-icon { width: 38px; height: 38px; border-radius: var(--radius-md); background: var(--bg-accent-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
    .kpi-value { font-size: 1.9rem; font-weight: 700; color: var(--text-primary); line-height: 1.2; }
    .kpi-sub { font-size: 0.8rem; color: var(--text-muted); }
    .grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; margin-bottom: 28px; }
    .section-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
    .section-title { font-size: 1.18rem; font-weight: 700; color: var(--text-primary); }

    /* Buttons & Badges */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: var(--radius-pill); font-weight: 600; font-size: 0.9rem; cursor: pointer; border: 1px solid transparent; transition: all 0.2s ease; text-decoration: none; }
    .btn-sm { padding: 6px 12px; font-size: 0.82rem; }
    .btn-primary { background: var(--primary); color: var(--primary-contrast); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--bg-subtle); color: var(--text-primary); border-color: var(--border-color); }
    .btn-secondary:hover { background: var(--bg-accent-soft); border-color: var(--primary); }
    .btn-success { background: var(--status-success-bg); color: var(--status-success-text); border-color: rgba(30, 126, 52, 0.25); }
    .btn-danger { background: var(--status-danger-bg); color: var(--status-danger-text); border-color: rgba(197, 34, 31, 0.25); }
    .btn-whatsapp { background: var(--whatsapp-green); color: #FFFFFF; }
    .btn-whatsapp:hover { background: var(--whatsapp-green-dark); }

    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: var(--radius-pill); font-size: 0.78rem; font-weight: 600; }
    .badge-success { background: var(--status-success-bg); color: var(--status-success-text); }
    .badge-danger { background: var(--status-danger-bg); color: var(--status-danger-text); }
    .badge-warning { background: var(--status-warning-bg); color: var(--status-warning-text); }
    .badge-neutral { background: var(--bg-subtle); color: var(--text-secondary); }

    /* Tables & Forms */
    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: start; }
    th, td { padding: 14px 16px; border-bottom: 1px solid var(--border-color); font-size: 0.92rem; }
    th { color: var(--text-secondary); font-weight: 600; font-size: 0.82rem; background: var(--bg-subtle); }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .form-label { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); }
    .form-control { padding: 10px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-primary); outline: none; }
    .form-control:focus { border-color: var(--primary); }
    .filter-bar { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; align-items: center; justify-content: space-between; }

    /* Workout Builder & Stickman GIF Thumbnails */
    .builder-layout { display: grid; grid-template-columns: 350px 1fr; gap: 24px; align-items: start; }
    .library-panel { background: var(--bg-surface); border: var(--card-border-width) solid var(--border-color); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-card); position: sticky; top: 72px; max-height: calc(100vh - 100px); overflow-y: auto; }
    .draggable-exercise { background: var(--bg-subtle); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 12px; margin-bottom: 12px; cursor: grab; transition: all 0.2s ease; }
    .draggable-exercise:hover { border-color: var(--primary); box-shadow: var(--shadow-card); }
    .week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
    .day-column { background: var(--bg-surface); border: var(--card-border-width) solid var(--border-color); border-radius: var(--radius-lg); padding: 18px; box-shadow: var(--shadow-card); display: flex; flex-direction: column; gap: 12px; min-height: 250px; }
    .day-column.drag-over { border: 2px dashed var(--primary); background: var(--bg-accent-soft); }
    .day-column.rest-day-card { background: var(--secondary-soft); border-color: var(--secondary); }
    .scheduled-item { background: var(--bg-subtle); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 12px; display: flex; flex-direction: column; gap: 8px; }

    .exercise-thumb {
      width: 100%;
      height: 155px;
      border-radius: var(--radius-sm);
      background: #FDF6F4;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 10px;
      cursor: pointer;
      position: relative;
    }
    .exercise-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .hero-banner { background: var(--banner-gradient); border: var(--card-border-width) solid var(--border-color); border-radius: var(--radius-lg); padding: 28px; margin-bottom: 26px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(20, 16, 24, 0.55); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 2000; }
    .modal-backdrop.open { display: flex; }
    .modal-box { background: var(--bg-surface); border-radius: var(--radius-lg); max-width: 640px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 28px; box-shadow: var(--shadow-hover); border: 1px solid var(--border-color); }
    .progress-track { width: 100%; height: 10px; background: var(--bg-subtle); border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--primary); border-radius: 999px; transition: width 0.35s ease; }
    .toast-container { position: fixed; bottom: 24px; inset-inline-end: 24px; z-index: 3000; display: flex; flex-direction: column; gap: 10px; }
    .toast { background: var(--text-primary); color: var(--bg-surface); padding: 12px 20px; border-radius: var(--radius-md); box-shadow: var(--shadow-hover); font-size: 0.9rem; font-weight: 500; }

    /* ==========================================================================
       2. WEEKLY FITNESS LEADERBOARD & WINNER SPECIAL STYLING
       ========================================================================== */
    .winner-spotlight-card {
      background: var(--winner-card-bg);
      border: 2px solid var(--winner-border);
      border-radius: var(--radius-lg);
      padding: 30px;
      margin-bottom: 28px;
      box-shadow: var(--winner-glow);
      position: relative;
      overflow: hidden;
    }

    .winner-spotlight-layout {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 26px;
      align-items: center;
    }

    .winner-avatar-wrapper {
      position: relative;
      width: 118px;
      height: 118px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 12px auto 6px;
      flex-shrink: 0;
    }

    .winner-avatar-ring {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      padding: 5px;
      background: var(--winner-ring);
      box-shadow: 0 0 0 5px rgba(212, 175, 55, 0.16), 0 10px 24px rgba(180, 130, 40, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .winner-avatar-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--bg-surface);
      background: var(--bg-surface);
    }

    .winner-crown-badge {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--winner-badge-bg);
      color: #FFFFFF;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.16);
      border: 2px solid #FFFFFF;
      z-index: 2;
    }

    .winner-rank-pill {
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--winner-badge-bg);
      color: #FFFFFF;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 2px 12px;
      border-radius: 999px;
      border: 2px solid #FFFFFF;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
      z-index: 2;
    }

    .winner-reward-banner {
      background: var(--reward-banner-bg);
      border: 1px solid var(--winner-border);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .winner-stats-box {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .winner-stat-pill {
      background: var(--bg-surface);
      border: 1px solid var(--winner-border);
      border-radius: var(--radius-md);
      padding: 12px 18px;
      min-width: 120px;
      text-align: center;
      box-shadow: var(--shadow-card);
    }

    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .leaderboard-row {
      background: var(--bg-surface);
      border: var(--card-border-width) solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 54px minmax(200px, 1.4fr) minmax(130px, 0.9fr) minmax(160px, 1.2fr) minmax(110px, 0.7fr);
      align-items: center;
      gap: 16px;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .leaderboard-row:hover {
      box-shadow: var(--shadow-hover);
    }

    .leaderboard-row.rank-1-row {
      border-color: var(--winner-border);
      background: var(--winner-card-bg);
    }

    .leaderboard-row.rank-2-row {
      border-inline-start: 4px solid var(--silver-accent);
    }

    .leaderboard-row.rank-3-row {
      border-inline-start: 4px solid var(--bronze-accent);
    }

    .leaderboard-row.is-current-trainee {
      outline: 2px solid var(--primary);
      background: var(--bg-accent-soft);
    }

    .rank-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.95rem;
      background: var(--bg-subtle);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }

    .rank-circle.rank-1 {
      background: var(--winner-badge-bg);
      color: #FFFFFF;
      border-color: #FFFFFF;
      box-shadow: 0 4px 10px rgba(212, 175, 55, 0.35);
    }

    .rank-circle.rank-2 {
      background: var(--silver-bg);
      color: #475467;
      border-color: var(--silver-accent);
    }

    .rank-circle.rank-3 {
      background: var(--bronze-bg);
      color: #8C4A19;
      border-color: var(--bronze-accent);
    }

    .you-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--primary);
      color: var(--primary-contrast);
      font-size: 0.73rem;
      font-weight: 700;
      margin-inline-start: 6px;
    }

    .motivation-strip {
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-inline-start: 4px solid var(--primary);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .fair-play-banner {
      background: var(--secondary-soft);
      border: 1px solid var(--secondary);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .proof-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--status-success-bg);
      color: var(--status-success-text);
    }

    .proof-chip.unverified {
      background: var(--status-warning-bg);
      color: var(--status-warning-text);
    }

    @media (max-width: 1024px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { border-inline-end: none; border-bottom: 1px solid var(--border-color); padding: 16px 20px; }
      .nav-list { flex-direction: row; flex-wrap: wrap; margin-top: 12px; }
      .nav-btn { width: auto; }
      .sidebar-footer { display: none; }
      .builder-layout, .grid-2 { grid-template-columns: 1fr; }
      .library-panel { position: static; max-height: none; }
      .winner-spotlight-layout { grid-template-columns: 1fr; text-align: center; }
      .winner-stats-box { justify-content: center; }
      .winner-reward-banner { justify-content: center; text-align: center; }
    }

    @media (max-width: 768px) {
      .workspace { padding: 18px; }
      .leaderboard-row {
        grid-template-columns: 44px 1fr;
        gap: 12px;
        padding: 14px;
      }
      .leaderboard-row .lb-col-workouts,
      .leaderboard-row .lb-col-progress,
      .leaderboard-row .lb-col-score {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>

    /* ==========================================================================
       6. HELPER FUNCTIONS & WEEKLY LEADERBOARD SCORING ENGINE
       ========================================================================== */
    function t(key) { return I18N[state.lang][key] || key; }
    function bi(obj, fieldBase) { return obj ? (state.lang === "ar" ? obj[fieldBase + "Ar"] : obj[fieldBase + "En"]) : ""; }
    function getBrandName() { return bi(state.platformBrand, "name"); }
    function getCoachName() { return bi(state.coachProfile, "name"); }
    function getRewardTitle() {
      return state.lang === "ar" ? state.leaderboard.rewardTitleAr : state.leaderboard.rewardTitleEn;
    }
    function getCategoryName(catId) {
      const cat = state.categories.find(c => c.id === catId);
      return cat ? (state.lang === "ar" ? cat.ar : cat.en) : catId;
    }
    function getDayName(dayKey) {
      const d = DAYS_OF_WEEK.find(x => x.key === dayKey);
      return d ? (state.lang === "ar" ? d.ar : d.en) : dayKey;
    }
    function getExerciseById(exId) { return state.exercises.find(e => e.id === exId); }

    function computeLeaderboardStandings(weekId) {
      const targetWeekId = weekId || state.leaderboard.selectedWeekId;
      const weekObj = state.leaderboard.weeks.find(w => w.id === targetWeekId) || state.leaderboard.weeks[0];

      let entries = [];

      if (!weekObj.isLive && weekObj.standingsSnapshot) {
        entries = weekObj.standingsSnapshot.map(snap => {
          const tr = state.trainees.find(x => x.id === snap.traineeId);
          if (!tr) return null;
          const percent = snap.total > 0 ? Math.round((snap.completed / snap.total) * 100) : 0;
          const score = percent;
          return {
            trainee: tr,
            completed: snap.completed,
            total: snap.total,
            percent,
            score
          };
        }).filter(Boolean);
      } else {
        entries = state.trainees.map(tr => {
          const stats = computeTraineeStats(tr);
          return {
            trainee: tr,
            completed: stats.completed,
            total: stats.total,
            percent: stats.percent,
            score: stats.percent
          };
        });
      }

      entries.sort((a, b) => {
        if (b.percent !== a.percent) return b.percent - a.percent;
        if (b.completed !== a.completed) return b.completed - a.completed;
        return a.trainee.id.localeCompare(b.trainee.id);
      });

      entries.forEach((entry, idx) => {
        entry.rank = idx + 1;
      });

      return {
        week: weekObj,
        entries,
        winner: entries.length > 0 ? entries[0] : null
      };
    }

    function openTraineeVerifyWorkoutModal(traineeId, dayKey, uid) {
      const tr = state.trainees.find(x => x.id === traineeId);
      if (!tr || !tr.schedule[dayKey]) return;
      const item = tr.schedule[dayKey].items.find(x => x.uid === uid);
      if (!item) return;
      const ex = getExerciseById(item.exerciseId);

      openModal(`
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
          <span style="font-size:1.6rem;">🛡️</span>
          <h3 class="section-title">${t("verifyModalTitle")}</h3>
        </div>
        <p style="font-size:0.86rem; color:var(--text-secondary); margin-bottom:16px;">
          ${t("verifyModalSubtitle")}
        </p>

        <div style="padding:12px 16px; background:var(--bg-subtle); border-radius:var(--radius-md); margin-bottom:16px; border:1px solid var(--border-color);">
          <strong>${bi(ex, "name")}</strong> — ${item.sets} ${t("setsLabel")} × ${bi(item, "reps")}
        </div>

        <div class="form-group">
          <label class="form-label">${t("verifyMethodLabel")}</label>
          <select class="form-control" id="verifyMethodSelect">
            <option value="watch">${t("verifyMethodWatch")}</option>
            <option value="weights">${t("verifyMethodWeights")}</option>
          </select>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">${t("verifyWeightUsedLabel")}</label>
            <input type="text" id="verifyWeightInput" class="form-control" placeholder="${t("verifyWeightPlaceholder")}" value="${state.lang === 'ar' ? 'دمبل ١٢ كجم' : '12 kg dumbbells'}" />
          </div>
          <div class="form-group">
            <label class="form-label">${t("verifyHeartRateLabel")}</label>
            <input type="text" id="verifyWatchInput" class="form-control" placeholder="${t("verifyHeartRatePlaceholder")}" value="${state.lang === 'ar' ? '٣٥ دقيقة • ٢٤٥ سعرة • ١٣٨ نبضة' : '35 mins • 245 kcal • 138 bpm'}" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">${t("verifyRpeLabel")}</label>
          <select class="form-control" id="verifyRpeSelect">
            <option value="8">${t("verifyRpeGood")}</option>
            <option value="6">${t("verifyRpeEasy")}</option>
            <option value="9">${t("verifyRpeMax")}</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">${t("verifyUploadWatchLabel")}</label>
          <input type="file" accept="image/*" class="form-control" />
        </div>

        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:18px;">
          <button class="btn btn-secondary" onclick="closeModal()">${t("cancel")}</button>
          <button class="btn btn-primary" onclick="submitVerifiedWorkout('${traineeId}', '${dayKey}', '${uid}')">
            ${t("verifySubmitBtn")}
          </button>
        </div>
      `);
    }

    function submitVerifiedWorkout(traineeId, dayKey, uid) {
      const tr = state.trainees.find(x => x.id === traineeId);
      if (!tr || !tr.schedule[dayKey]) return;
      const item = tr.schedule[dayKey].items.find(x => x.uid === uid);
      if (!item) return;

      const weightVal = document.getElementById("verifyWeightInput").value.trim();
      const watchVal = document.getElementById("verifyWatchInput").value.trim();

      item.status = "completed";
      item.verified = true;
      item.weightLogEn = weightVal || "12 kg";
      item.weightLogAr = weightVal || "١٢ كجم";
      item.watchLogEn = watchVal || "35 min • 240 kcal";
      item.watchLogAr = watchVal || "٣٥ دقيقة • ٢٤٠ سعرة";

      tr.coachVerifiedProof = true;
      if (state.lang === "ar") {

    function openCoachProofReviewModal(traineeId) {
      const tr = state.trainees.find(x => x.id === traineeId);
      if (!tr) return;

      const completedLogs = [];
      DAYS_OF_WEEK.forEach(d => {
        const dayObj = tr.schedule[d.key];
        if (dayObj && !dayObj.isRestDay) {
          dayObj.items.forEach(item => {
            if (item.status === "completed") {
              const ex = getExerciseById(item.exerciseId);
              completedLogs.push({ dayKey: d.key, item, ex });
            }
          });
        }
      });

      openModal(`
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:14px;">
          <div class="avatar" style="width:48px; height:48px;"><img src="${tr.avatarUrl}" alt="${bi(tr, "name")}" /></div>

            <h3 class="section-title">${t("proofModalTitle")} — ${bi(tr, "name")}</h3>
            <div style="font-size:0.84rem; color:var(--text-secondary);">⌚ ${bi(tr, "proofSummary")}</div>
          </div>
        </div>

        <div style="display:flex; flex-direction:column; gap:10px; margin:16px 0;">
          ${completedLogs.length === 0 ? `<p style="color:var(--text-muted);">${t("noCompletedYet")}</p>` :
            completedLogs.map(log => `
              <div style="padding:12px; border-radius:var(--radius-md); background:var(--bg-subtle); border:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
                <div>
                  <strong>${log.ex ? bi(log.ex, "name") : ""} (${getDayName(log.dayKey)})</strong>
                  <div style="font-size:0.8rem; color:var(--text-secondary);">
                    🏋️‍♀️ ${bi(log.item, "weightLog") || "12 kg"} &nbsp;|&nbsp; ⌚ ${bi(log.item, "watchLog") || "230 kcal • 136 bpm"}
                  </div>
                </div>
                <span class="proof-chip">✓ ${t("proofVerifiedBadge")}</span>
              </div>
            `).join("")
          }
        </div>

        <div style="display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap; margin-top:18px;">
          <button class="btn btn-secondary" onclick="closeModal()">${t("closeBtn")}</button>
          <button class="btn btn-danger" onclick="coachFlagFakeWorkout('${tr.id}')">${t("coachFlagProofBtn")}</button>
          <button class="btn btn-success" onclick="coachApproveWorkoutProof('${tr.id}')">${t("coachApproveProofBtn")}</button>
        </div>
      `);
    }

    function coachApproveWorkoutProof(traineeId) {
      const tr = state.trainees.find(x => x.id === traineeId);

      showToast(t("toastCoachApprovedProof"));

    function updateModalStickmanPreview(presetKey) {
      modalCustomMediaUrl = "";
      const img = document.getElementById("modalExPreview");
      if (img) img.src = createStickmanGif(presetKey);
    }

    function handleCustomExerciseFile(ev) {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        modalCustomMediaUrl = e.target.result;
        const img = document.getElementById("modalExPreview");
        if (img) img.src = modalCustomMediaUrl;
      };
      reader.readAsDataURL(file);
    }

    function saveNewExercise() {
      const nameAr = document.getElementById("exFormNameAr").value.trim() || "تمرين مخصص";
      const nameEn = document.getElementById("exFormNameEn").value.trim() || "Custom Exercise";
      const categoryId = document.getElementById("exFormCat").value;
      const defaultSets = parseInt(document.getElementById("exFormSets").value, 10) || 3;
      const presetKey = document.getElementById("exFormStickmanPreset").value;

      state.exercises.unshift({
        id: "ex_" + Date.now(),
        categoryId,
        nameEn,
        nameAr,
        descEn: "Guided movement with controlled form.",
        descAr: "تمرين موجه بأداء متوازن وصحيح.",
        defaultSets,
        repsEn: "12 reps",
        repsAr: "١٢ تكرار",
        restEn: "60 sec",
        restAr: "٦٠ ثانية",
        presetKey,
        mediaUrl: modalCustomMediaUrl || createStickmanGif(presetKey)
      });

      closeModal();
      showToast(t("toastExerciseCreated"));
      renderWorkspace();

    /* ==========================================================================
       14. TRAINEE & ADMIN WORKSPACE CONTROLLERS
       ========================================================================== */
    function computeTraineeStats(tr) {
      let total = 0, completed = 0, skipped = 0, activeDays = 0;
      const byDay = {}, completedItems = [];
      DAYS_OF_WEEK.forEach(d => {
        const dayObj = tr.schedule[d.key] || { isRestDay: false, items: [] };
        if (!dayObj.isRestDay && dayObj.items.length > 0) activeDays++;
        let dTotal = 0, dComp = 0;
        if (!dayObj.isRestDay) {
          dayObj.items.forEach(item => {
            total++; dTotal++;
            const ex = getExerciseById(item.exerciseId);
            if (item.status === "completed") {
              completed++; dComp++;
              if (ex) completedItems.push({ dayKey: d.key, ex, item });
            } else if (item.status === "skipped") skipped++;
          });
        }
        byDay[d.key] = { isRestDay: dayObj.isRestDay, total: dTotal, completed: dComp, percent: dTotal ? Math.round((dComp / dTotal) * 100) : 0 };
      });
      return { total, completed, skipped, activeDays, percent: total ? Math.round((completed / total) * 100) : 0, byDay, completedItems };
    }

    function renderTraineeWorkspace() {

            <div class="kpi-card"><div class="kpi-top"><span>${t("kpiSkippedCount")}</span></div><div class="kpi-value">${stats.skipped}</div></div>
            <div class="kpi-card"><div class="kpi-top"><span>${t("kpiActiveDays")}</span></div><div class="kpi-value">${stats.activeDays} / 7</div></div>

          <div class="grid-2">

                      </div>

              </div>
            </div>
            <div class="card">
              <div class="section-header"><h3 class="section-title">${t("completedLogTitle")}</h3></div>
              ${stats.completedItems.length === 0 ? `<p style="color:var(--text-muted);">${t("noCompletedYet")}</p>` :

                  <div style="padding:10px; border-radius:var(--radius-md); background:var(--bg-subtle); margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">

      return `
        <div class="hero-banner">
          <div>
            <span class="badge badge-success" style="margin-bottom:8px;">${t("statusActive")}</span>

          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn btn-primary" onclick="setTraineePage('leaderboard')">🏆 ${t("navLeaderboard")}</button>
            <a href="${coachWhatsappUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-whatsapp">💬 ${t("contactCoachWhatsApp")}</a>
          </div>
        </div>

        <div class="fair-play-banner">
          <div>
            <div style="font-weight:700; font-size:0.9rem;">${t("fairPlayBannerTitle")}</div>
            <div style="font-size:0.82rem; color:var(--text-secondary);">${t("fairPlayBannerSub")}</div>
          </div>
        </div>

        <div class="week-grid">
          ${DAYS_OF_WEEK.map(d => {
            const daySchedule = tr.schedule[d.key] || { isRestDay: false, items: [] };
            return `
              <div class="day-column ${daySchedule.isRestDay ? "rest-day-card" : ""}">
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color); padding-bottom:10px;">

                ${daySchedule.isRestDay ? `<div style="padding:26px 12px; text-align:center;">🌿 ${t("restDayBannerTitle")}</div>` :
                  daySchedule.items.map(item => {
                    const ex = getExerciseById(item.exerciseId);
                    return ex ? `
                      <div class="scheduled-item">
                        <div class="exercise-thumb" style="height:135px;" onclick="previewExerciseGifModal('${ex.id}')">
                          <img src="${ex.mediaUrl}" alt="${bi(ex, "name")}" />

                          <strong>${bi(ex, "name")}</strong>
                          ${item.status === "completed" ? `<span class="proof-chip">✓ ${t("proofVerifiedBadge")}</span>` : ""}
                        </div>
                        <div style="font-size:0.82rem; color:var(--primary); font-weight:600;">${item.sets} × ${bi(item, "reps")} • ${bi(item, "rest")}</div>
                        ${item.status === "completed" && bi(item, "weightLog") ? `
                          <div style="font-size:0.76rem; color:var(--status-success-text); font-weight:600;">
                            🏋️‍♀️ ${bi(item, "weightLog")} • ⌚ ${bi(item, "watchLog")}
                          </div>

                        ${bi(item, "notes") ? `<p style="font-size:0.78rem; color:var(--text-secondary);">📝 ${bi(item, "notes")}</p>` : ""}
                        <div style="display:flex; gap:8px; margin-top:6px;">
                          <button class="btn btn-sm ${item.status === "completed" ? "btn-success" : "btn-secondary"}" style="flex:1;" onclick="openTraineeVerifyWorkoutModal('${tr.id}', '${d.key}', '${item.uid}')">
                            🛡️ ${t("completed")}
                          </button>
                          <button class="btn btn-sm ${item.status === "skipped" ? "btn-danger" : "btn-secondary"}" style="flex:1;" onclick="updateTraineeExerciseStatus('${tr.id}', '${d.key}', '${item.uid}', 'skipped')">
                            ⏭️ ${t("skipped")}

                        </div>
                      </div>
                    ` : "";
                  }).join("")
                }
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderAdminWorkspace() {

    /* ==========================================================================
       15. EVENT HANDLERS & LEADERBOARD MANAGEMENT ACTIONS
       ========================================================================== */
    function setTheme(themeId) { state.theme = themeId; renderApp(); }
    function setRole(roleId) { state.role = roleId; renderApp(); }
    function toggleLanguage() { state.lang = state.lang === "en" ? "ar" : "en"; renderApp(); }
    function setCoachPage(page) { state.coachPage = page; renderApp(); }
    function setTraineePage(page) { state.traineePage = page; renderApp(); }
    function setAdminPage(page) { state.adminPage = page; renderApp(); }
    function switchActiveTraineeAccount(traineeId) { state.activeTraineeAccountId = traineeId; renderApp(); }
    function openTraineeDetails(traineeId) { state.selectedTraineeId = traineeId; state.coachPage = "trainee-details"; renderApp(); }

    function selectLeaderboardWeek(weekId) {
      state.leaderboard.selectedWeekId = weekId;
      renderWorkspace();

    function toggleLeaderboardEnabled(checked) {
      state.leaderboard.enabled = checked;
      showToast(t("toastLbSettingsSaved"));
      renderWorkspace();
    }

    function toggleLeaderboardPublished(checked) {

      showToast(t("toastLbSettingsSaved"));

    }

    function changeLeaderboardStage(stageVal) {

      showToast(t("toastLbSettingsSaved"));

    function saveLeaderboardRewardSettings() {
      const rAr = document.getElementById("lbRewardArInput");
      const rEn = document.getElementById("lbRewardEnInput");
      if (rAr && rAr.value.trim()) state.leaderboard.rewardTitleAr = rAr.value.trim();
      if (rEn && rEn.value.trim()) state.leaderboard.rewardTitleEn = rEn.value.trim();
      showToast(t("toastLbSettingsSaved"));
      renderWorkspace();
    }

    function openResetLeaderboardWeekModal() {
      openModal(`
        <h3 class="section-title" style="margin-bottom:12px;">🔄 ${t("lbResetModalTitle")}</h3>
        <p style="color:var(--text-secondary); line-height:1.7; margin-bottom:20px;">
          ${t("lbResetModalText")}
        </p>
        <div style="display:flex; justify-content:flex-end; gap:10px;">
          <button class="btn btn-secondary" onclick="closeModal()">${t("cancel")}</button>
          <button class="btn btn-primary" onclick="confirmStartNewLeaderboardWeek()">✓ ${t("lbConfirmResetBtn")}</button>
        </div>
      `);
    }

    function confirmStartNewLeaderboardWeek() {
      const currentStandings = computeLeaderboardStandings("w_current");
      if (currentStandings.winner) {
        state.leaderboard.previousWinnersArchive.unshift({
          weekEn: currentStandings.week.shortEn,
          weekAr: currentStandings.week.shortAr,
          traineeId: currentStandings.winner.trainee.id,
          completed: currentStandings.winner.completed,
          total: currentStandings.winner.total,
          percent: currentStandings.winner.percent,
          score: currentStandings.winner.score,
          rewardEn: state.leaderboard.rewardTitleEn,
          rewardAr: state.leaderboard.rewardTitleAr
        });
      }

      const currentWeekObj = state.leaderboard.weeks.find(w => w.id === "w_current");
      if (currentWeekObj) {
        currentWeekObj.labelEn = "October 26 – November 1 (New Week)";
        currentWeekObj.labelAr = "٢٦ أكتوبر – ١ نوفمبر (الأسبوع الجديد)";
        currentWeekObj.shortEn = "Oct 26 – Nov 1";
        currentWeekObj.shortAr = "٢٦ أكتوبر – ١ نوفمبر";
      }

      state.trainees.forEach((tr, idx) => {
        let firstMarked = false;
        DAYS_OF_WEEK.forEach(d => {
          const dayObj = tr.schedule[d.key];
          if (dayObj && !dayObj.isRestDay) {
            dayObj.items.forEach(item => {
              if (!firstMarked && idx === 1) {
                item.status = "completed";
                item.verified = true;
                firstMarked = true;
              } else {
                item.status = "pending";
                item.verified = false;
              }
            });
          }
        });
      });

      state.leaderboard.selectedWeekId = "w_current";
      closeModal();
      showToast(t("toastLbNewWeekStarted"));
      renderWorkspace();
    }

    function simulateWorkoutDelta(traineeId, delta) {
      const tr = state.trainees.find(x => x.id === traineeId);
      if (!tr) return;

      state.leaderboard.selectedWeekId = "w_current";

      const allItems = [];
      DAYS_OF_WEEK.forEach(d => {
        const dayObj = tr.schedule[d.key];
        if (dayObj && !dayObj.isRestDay) {
          dayObj.items.forEach(item => allItems.push(item));
        }
      });

      if (delta > 0) {
        const target = allItems.find(item => item.status !== "completed");
        if (target) {
          target.status = "completed";
          target.verified = true;
          tr.coachVerifiedProof = true;
        }
      } else if (delta < 0) {
        const completedList = allItems.filter(item => item.status === "completed");
        if (completedList.length > 0) {
          completedList[completedList.length - 1].status = "pending";
        }
      }
      renderWorkspace();
    }

    function toggleTraineeAccess(traineeId) {
      const tr = state.trainees.find(x => x.id === traineeId);
      if (!tr) return;
      const newStatus = !(tr.subscriptionActive && tr.planUnlocked);
      tr.subscriptionActive = newStatus;
      tr.planUnlocked = newStatus;
      showToast(t("toastAccessUpdated"));
      renderApp();
    }

    function handleDragStart(ev, exerciseId) {
      state.draggedExerciseId = exerciseId;
      ev.dataTransfer.setData("text/plain", exerciseId);
    }

    function handleDropOnDay(ev, traineeId, dayKey) {
      ev.preventDefault();
      ev.currentTarget.classList.remove("drag-over");
      const exId = ev.dataTransfer.getData("text/plain") || state.draggedExerciseId;
      if (exId) addExerciseToDay(traineeId, dayKey, exId);
    }

    function addExerciseToDay(traineeId, dayKey, exerciseId) {
      const tr = state.trainees.find(x => x.id === traineeId);
      const ex = getExerciseById(exerciseId);
      if (!tr || !ex) return;
      if (!tr.schedule[dayKey]) tr.schedule[dayKey] = { isRestDay: false, items: [] };
      tr.schedule[dayKey].isRestDay = false;
      tr.schedule[dayKey].items.push({
        uid: "si_" + Date.now(),
        exerciseId: ex.id,
        sets: ex.defaultSets,
        repsEn: ex.repsEn,
        repsAr: ex.repsAr,
        restEn: ex.restEn,
        restAr: ex.restAr,
        notesEn: "",
        notesAr: "",
        status: "pending",
        verified: false
      });
      showToast(t("toastExerciseAdded"));
      renderWorkspace();
    }

    function removeScheduledExercise(traineeId, dayKey, uid) {
      const tr = state.trainees.find(x => x.id === traineeId);
      if (tr && tr.schedule[dayKey]) {
        tr.schedule[dayKey].items = tr.schedule[dayKey].items.filter(i => i.uid !== uid);
        renderWorkspace();
      }
    }

    function toggleDayRest(traineeId, dayKey) {
      const tr = state.trainees.find(x => x.id === traineeId);
      if (tr) {
        if (!tr.schedule[dayKey]) tr.schedule[dayKey] = { isRestDay: false, items: [] };
        tr.schedule[dayKey].isRestDay = !tr.schedule[dayKey].isRestDay;
        renderWorkspace();
      }
    }

    function updateTraineeExerciseStatus(traineeId, dayKey, uid, newStatus) {
      const tr = state.trainees.find(x => x.id === traineeId);
      if (tr && tr.schedule[dayKey]) {
        const item = tr.schedule[dayKey].items.find(x => x.uid === uid);
        if (item) { item.status = newStatus; renderWorkspace(); }
      }
    }

    renderApp();
  </script>
